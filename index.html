    <script>
      (function() {
        if (typeof window !== 'undefined') {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            function ViteHMRMockSocket() {
              var target = new EventTarget();
              target.readyState = 1;
              target.protocol = 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.send = function() {};
              target.close = function() {
                target.readyState = 3;
                try {
                  target.dispatchEvent(new Event('close'));
                } catch (_) {}
              };
              setTimeout(function() {
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (_) {}
              }, 10);
              return target;
            }

            window.WebSocket = function(url, protocols) {
              var isViteHmr =
                (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1));

              if (isViteHmr) {
                return ViteHMRMockSocket();
              }
              return new NativeWebSocket(url, protocols);
            };

            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason && (event.reason.message || String(event.reason));
            if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite:ws') !== -1)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(event) {
            var msg = (event && event.message) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }
      })();
    </script>
